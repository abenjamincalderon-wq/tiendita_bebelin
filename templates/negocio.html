 {% extends "base.html" %} {% block title %}Registrar precio | Tiendita Bebelín{% endblock %} {% block content %}

<section class="bienvenida">
    <h1>Registrar un precio</h1>
    <p>Ayuda a tu comunidad compartiendo los precios de los negocios de barrio.</p>
</section>

<form action="{{ url_for('negocio') }}" method="POST" class="formulario-precio">

    <label for="nombre">Nombre del negocio</label>
    <input type="text" id="nombre" name="nombre" placeholder="Ej: Almacén Don Pedro" required>

    <label for="direccion">Dirección del negocio</label>
    <input type="text" id="direccion" name="direccion" placeholder="Ej: Avenida Los Ángeles 123" required>

    <label for="producto">Producto</label>
    <input type="text" id="producto" name="producto" placeholder="Ej: Leche" required>

    <label for="precio">Precio en pesos chilenos</label>
    <input type="number" id="precio" name="precio" min="1" placeholder="Ej: 1200" required>

    <button type="submit">Guardar precio</button>

    <a href="{{ url_for('inicio') }}" class="volver">
        Volver al mapa
    </a>

</form>

{% endblock %}
